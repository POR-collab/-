<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Desktop 📁</title>
<link rel="stylesheet" href="shared.css">
<style>
  .mem-row { border: 2px dashed var(--border); padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .mem-row .del { position: absolute; top: 4px; right: 4px; font-size: 7px; padding: 4px 6px; box-shadow: none; }
  .mem-row input, .mem-row textarea { font-size: 14px; padding: 6px; }
  .mem-row textarea { min-height: 48px; }

  /* desktop */
  #desktop { position: fixed; inset: 0; z-index: 5; display: none; }
  .icons {
    position: absolute; inset: 0 0 40px 0; padding: 48px 12px 12px;
    display: grid; grid-template-columns: repeat(auto-fill, 88px); grid-auto-rows: 96px; gap: 8px; align-content: start;
  }
  .icon {
    display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; background: none; border: 0;
    color: var(--ink); font-family: inherit; padding: 4px;
  }
  .icon .pic { font-size: 34px; filter: drop-shadow(2px 2px 0 var(--border)); }
  .icon .lbl { font-family: 'Mitr', sans-serif; font-size: 12px; line-height: 1.3; max-width: 84px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .icon:focus .lbl, .icon:hover .lbl { background: var(--yes); color: #fff; }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: var(--bar); border-top: 3px solid var(--border);
    display: flex; align-items: center; gap: 6px; padding: 0 6px; overflow-x: auto; z-index: 60;
  }
  .taskbar .btn { font-size: 7px; padding: 6px 8px; white-space: nowrap; box-shadow: 2px 2px 0 var(--border); }
  .clock { margin-left: auto; font-size: 8px; padding: 6px; border: 2px inset var(--border); white-space: nowrap; }
  .mwin { position: absolute; width: min(340px, calc(100vw - 24px)); z-index: 20; animation: popIn .3s ease-out; }
  .mwin .titlebar { cursor: move; touch-action: none; }
  .mwin .content { max-height: 60vh; overflow-y: auto; align-items: stretch; text-align: left; }
  .mwin img { width: 100%; image-rendering: auto; border: 2px solid var(--border); }
  .mwin .date { font-size: 7px; opacity: .7; }
  .mwin .body { font-size: 15px; line-height: 1.7; white-space: pre-wrap; }
  .welcome .content { align-items: center; text-align: center; }
</style>
</head>
<body data-theme="pink">
<a class="home-link" id="homeLink" href="./hub.html">← ALL</a>

<!-- CREATOR -->
<div class="window wide" id="creator" hidden>
  <div class="titlebar"><span>📁 MEMORIES.exe</span><div class="titlebar-btns"><div>─</div><div>□</div><div>✕</div></div></div>
  <div class="content">
    <h1>Memory<br>Desktop</h1>
    <p class="hint thai">รวมความทรงจำเป็นไฟล์บนเดสก์ท็อปพิกเซล คลิกเปิดดูทีละเรื่อง</p>
    <form id="form" autocomplete="off">
      <label>TITLE (ชื่อคอลเลกชัน)<input id="fTitle" maxlength="60" value="ความทรงจำของเรา"></label>
      <label>FROM (จาก)<input id="fFrom" maxlength="40" placeholder="ชื่อของคุณ"></label>
      <label>MEMORIES</label>
      <div id="rows" style="display:flex;flex-direction:column;gap:10px"></div>
      <button type="button" class="btn" id="addBtn">+ ADD MEMORY</button>
      <p class="hint thai" style="font-size:12px">รูปใส่เป็นลิงก์รูปภาพ (URL) เพราะข้อมูลทั้งหมดถูกเก็บในลิงก์ที่แชร์</p>
      <label>THEME<div class="themes" id="themes"></div></label>
      <div class="row">
        <button type="button" class="btn" id="previewBtn">PREVIEW</button>
        <button type="submit" class="btn btn-yes">MAKE LINK</button>
      </div>
    </form>
    <div class="share" id="shareBox">
      <input id="shareUrl" readonly>
      <div class="row"><button class="btn btn-yes" id="copyBtn">COPY</button><button class="btn" id="nativeShare">SHARE</button></div>
      <div class="toast thai" id="toast"></div>
    </div>
  </div>
</div>

<!-- DESKTOP VIEWER -->
<div id="desktop">
  <div class="icons" id="icons"></div>
  <div class="taskbar" id="taskbar">
    <button class="btn btn-yes" id="startBtn">💕 START</button>
    <span class="clock" id="clock"></span>
  </div>
</div>

<script src="shared.js"></script>
<script>
floatingHearts(15);
const ICONS = ['📷','💌','🎂','🌸','🍰','🎡','🌙','✈️','🎬','🍜','🏖️','🎁'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';

// ----- creator -----
let theme = 'pink';
themePicker($('themes'), theme, t => theme = t);
function addRow(m = {}) {
  const r = document.createElement('div'); r.className = 'mem-row';
  r.innerHTML = `<button type="button" class="btn del">✕</button>
    <input class="m-date" type="date">
    <input class="m-title" maxlength="50" placeholder="ชื่อความทรงจำ">
    <textarea class="m-text" maxlength="400" placeholder="เล่าเรื่องสั้นๆ"></textarea>
    <input class="m-img" placeholder="ลิงก์รูป (ไม่บังคับ) https://...">`;
  r.querySelector('.m-date').value = m.d || '';
  r.querySelector('.m-title').value = m.ti || '';
  r.querySelector('.m-text').value = m.tx || '';
  r.querySelector('.m-img').value = m.im || '';
  r.querySelector('.del').onclick = () => r.remove();
  $('rows').appendChild(r);
}
addRow({ d:'2025-02-14', ti:'วันแรกที่เจอกัน', tx:'ยังจำได้ว่าตื่นเต้นมาก 🥺' });
addRow({ d:'2025-06-01', ti:'ทริปทะเล', tx:'ทะเลสวย แต่เธอสวยกว่า 🏖️' });
addRow({ d:'2026-02-14', ti:'ครบรอบ 1 ปี', tx:'ขอบคุณที่อยู่ด้วยกันนะ 💕' });
$('addBtn').onclick = () => addRow();

function formData() {
  const ms = [...document.querySelectorAll('.mem-row')].map(r => ({
    d: r.querySelector('.m-date').value, ti: r.querySelector('.m-title').value.trim(),
    tx: r.querySelector('.m-text').value.trim(), im: r.querySelector('.m-img').value.trim()
  })).filter(m => m.ti || m.tx || m.im).map(m => { Object.keys(m).forEach(k => !m[k] && delete m[k]); return m; });
  return { ti: $('fTitle').value.trim(), f: $('fFrom').value.trim(), t: theme, ms };
}
$('previewBtn').onclick = () => showDesktop(formData(), true);
$('form').onsubmit = e => { e.preventDefault(); wireShare(formData); };

// ----- desktop -----
let z = 30, openCount = 0;
function bringFront(w) { w.style.zIndex = ++z; }
function drag(win) {
  const bar = win.querySelector('.titlebar');
  let ox, oy, on = false;
  bar.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    on = true; bar.setPointerCapture(e.pointerId); bringFront(win);
    const r = win.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top;
  });
  bar.addEventListener('pointermove', e => {
    if (!on) return;
    win.style.left = Math.max(0, Math.min(innerWidth - 60, e.clientX - ox)) + 'px';
    win.style.top  = Math.max(0, Math.min(innerHeight - 80, e.clientY - oy)) + 'px';
  });
  bar.addEventListener('pointerup', () => on = false);
  win.addEventListener('pointerdown', () => bringFront(win));
}
function openWindow(title, html, extraClass = '') {
  const w = document.createElement('div');
  w.className = 'window mwin ' + extraClass;
  w.innerHTML = `<div class="titlebar"><span class="thai" style="font-size:12px">${esc(title)}</span>
    <div class="titlebar-btns"><button class="x">✕</button></div></div><div class="content">${html}</div>`;
  const off = (openCount++ % 6) * 18;
  w.querySelector('.x').onclick = () => { blip(300); w.remove(); };
  $('desktop').appendChild(w); drag(w); bringFront(w);
  // keep inside the screen; on narrow screens sit below the first icon row
  const ww = w.offsetWidth;
  w.style.left = Math.max(8, Math.min(innerWidth - ww - 12, innerWidth / 2 - ww / 2 + off)) + 'px';
  w.style.top = ((innerWidth < 600 ? 160 : 60) + off) + 'px';
  return w;
}
function fmtDate(d) {
  if (!d) return '';
  const x = new Date(d + 'T00:00');
  return isNaN(x) ? d : x.toLocaleDateString('th-TH', { day:'numeric', month:'long', year:'numeric' });
}
function openMemory(m, i) {
  blip(600);
  const img = safeUrl(m.im) ? `<img src="${esc(safeUrl(m.im))}" alt="" loading="lazy">` : '';
  openWindow(`${ICONS[i % ICONS.length]} ${m.ti || 'Memory ' + (i+1)}`,
    `<div class="date">${esc(fmtDate(m.d))}</div>${img}<div class="body thai">${esc(m.tx || '')}</div>`);
}
function showDesktop(d, preview) {
  $('creator').hidden = true; $('desktop').style.display = 'block';
  document.querySelectorAll('.mwin').forEach(w => w.remove());
  setTheme(d.t);
  const ms = (d.ms || []).slice().sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  const icons = $('icons'); icons.innerHTML = '';
  ms.forEach((m, i) => {
    const b = document.createElement('button'); b.className = 'icon';
    b.innerHTML = `<span class="pic">${ICONS[i % ICONS.length]}</span><span class="lbl">${esc(m.ti || 'Memory ' + (i+1))}</span>`;
    b.onclick = () => openMemory(m, i);
    icons.appendChild(b);
  });
  const welcome = () => {
    const w = openWindow('💌 WELCOME.txt',
      `<h1 class="${hasThai(d.ti) ? 'thai' : ''}">${esc(d.ti || 'Our Memories')}</h1>
       <div class="thai" style="font-size:14px">มีความทรงจำ ${ms.length} เรื่อง<br>ดับเบิลคลิก... เอ้ย คลิกที่ไอคอนเพื่อเปิดดูนะ</div>
       ${d.f ? `<div class="thai" style="font-size:14px;opacity:.8">— ${esc(d.f)}</div>` : ''}
       <button class="btn btn-yes" id="playAll">▶ SLIDESHOW</button>`, 'welcome');
    w.querySelector('#playAll').onclick = () => { w.remove(); slideshow(ms); };
  };
  welcome();
  $('startBtn').onclick = welcome;
  // taskbar extra button
  const tb = $('taskbar'); tb.querySelectorAll('.extra').forEach(x => x.remove());
  const back = document.createElement(preview ? 'button' : 'a');
  back.className = 'btn extra';
  back.textContent = preview ? '← EDIT' : '+ MAKE YOURS';
  if (preview) back.onclick = () => { $('desktop').style.display = 'none'; $('creator').hidden = false; };
  else back.href = 'memories.html';
  tb.insertBefore(back, $('clock'));
  $('homeLink').style.display = 'none';
}
function slideshow(ms) {
  let i = 0;
  const step = () => {
    if (i >= ms.length) { confetti(); return; }
    document.querySelectorAll('.mwin').forEach(w => w.remove());
    openMemory(ms[i], i); i++;
    setTimeout(step, 4000);
  };
  step();
}
setInterval(() => $('clock').textContent = new Date().toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' }), 1000);

const data = hashData();
if (data && data.ms) showDesktop(data, false);
else { $('creator').hidden = false; setTheme(theme); }
</script>
</body>
</html>
